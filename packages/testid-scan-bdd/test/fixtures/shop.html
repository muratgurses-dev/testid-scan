<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture shop</title>
</head>
<body>
  <!-- A small page with one of each case the step generator handles. Scanned by scripts/update-fixture.mjs. -->
  <header>
    <a href="#home">Home</a>
    <a href="#cart">Cart</a>
    <button data-testid="open-menu-button" id="menu-toggle"><svg width="12" height="12" aria-hidden="true"></svg></button>
    <nav id="menu" hidden><a href="#help">Help</a></nav>
  </header>

  <main>
    <label for="search">Search products</label>
    <input id="search" type="text">

    <button id="favorite" aria-label="Add to favorites">&#9829;</button>

    <h2>Products</h2>
    <ul id="products">
      <li>Lamp <button class="add">Add to cart</button></li>
      <li>Chair <button class="add">Add to cart</button></li>
      <li>Desk <button class="add">Add to cart</button></li>
    </ul>
    <p id="status" role="status"></p>

    <h2>Your cart</h2>
    <ul id="cart">
      <li>Lamp in cart <button class="remove">Remove</button></li>
      <li>Desk in cart <button class="remove">Remove</button></li>
    </ul>

    <label><input type="checkbox" id="gift"> Gift wrap</label>

    <label for="shipping">Shipping</label>
    <select id="shipping">
      <option>Standard</option>
      <option>Express</option>
    </select>

    <button data-testid="delete-selected-button">Delete</button>
    <button data-testid="delete-all-button">Delete</button>

    <!-- the same name twice and no test ID: no step can find either one -->
    <button>Compare</button>
    <button>Compare</button>

    <h2>Orders</h2>
    <table>
      <tr><th>Order</th><th></th></tr>
      <tr><td>1042</td><td><button class="open">Open</button></td></tr>
      <tr><td>1043</td><td><button class="open">Open</button></td></tr>
    </table>
  </main>

  <script>
    const status = document.getElementById('status');
    document.getElementById('menu-toggle').addEventListener('click', () => { document.getElementById('menu').hidden = false; });
    const favorite = document.getElementById('favorite');
    favorite.addEventListener('click', () => {
      favorite.setAttribute('aria-label', favorite.getAttribute('aria-label') === 'Add to favorites' ? 'Remove from favorites' : 'Add to favorites');
    });
    for (const button of document.querySelectorAll('.add')) {
      button.addEventListener('click', () => { status.textContent = `Added ${button.parentElement.firstChild.textContent.trim()} to the cart`; });
    }
    for (const button of document.querySelectorAll('.remove')) button.addEventListener('click', () => button.parentElement.remove());
    for (const button of document.querySelectorAll('.open')) {
      button.addEventListener('click', () => { status.textContent = `Opened order ${button.closest('tr').cells[0].textContent}`; });
    }
    document.getElementById('shipping').addEventListener('change', (e) => { status.textContent = `Shipping: ${e.target.value}`; });
    document.querySelector('[data-testid="delete-all-button"]').addEventListener('click', () => { status.textContent = 'Deleted all'; });
  </script>
</body>
</html>
